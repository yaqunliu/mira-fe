version: '3.8'

services:
  novel2video:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novel2video
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      - PORT=3000
    env_file:
      - .env.production
    volumes:
      # 持久化上传文件
      - ./uploads:/app/uploads
      # 如果有其他需要持久化的目录，可以添加
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - novel2video-network

networks:
  novel2video-network:
    driver: bridge

